name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Target platform
        type: choice
        default: Android
        options: [Android, StandaloneOSX, StandaloneWindows64, StandaloneLinux64, WebGL]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ github.event.inputs.platform || 'Android' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Bail out if the Unity project is not initialised
        run: |
          if [ ! -f ProjectSettings/ProjectVersion.txt ]; then
            echo "::error::No Unity project found. See docs/SETUP.md."
            exit 1
          fi

      # Android builds exhaust the default runner disk. Done inline rather than
      # with a third-party action: this needs no supply-chain trust and no
      # version pin to maintain. Reclaims roughly 25 GB.
      # GameCI builds inside unityci/editor, which carries its own Android SDK,
      # so the runner's own SDK and toolchains are safe to delete.
      - name: Free disk space
        if: ${{ (github.event.inputs.platform || 'Android') == 'Android' }}
        run: |
          echo "Before:" && df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/lib/node_modules \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune --all --force || true
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          echo "After:" && df -h /

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ github.event.inputs.platform || 'Android' }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ github.event.inputs.platform || 'Android' }}-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ github.event.inputs.platform || 'Android' }}
          # Debug builds only. Release signing needs androidKeystoreBase64 and
          # friends as secrets; see docs/SETUP.md before enabling that.

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.event.inputs.platform || 'Android' }}
          path: build
          retention-days: 14
