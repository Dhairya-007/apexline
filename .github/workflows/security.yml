name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'     # Monday 06:00 UTC — catches anything merged blind
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # the whole point: --history needs every commit
          lfs: false

      # Uses the repo's own scanner. No third-party action, so there is no
      # supply-chain dependency and no pin to keep current in a job whose
      # entire purpose is trust.
      - name: Scan every commit for secrets
        run: ./scripts/scan-secrets.sh --history

  permissions-audit:
    name: Workflow permissions audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pull_request_target runs with repository secrets available to code from
      # the fork. For a game repo holding Unity credentials and a signing
      # keystore, that is the most consequential single mistake available.
      - name: Forbid pull_request_target
        run: |
          # Comments are stripped before matching, and this workflow is skipped,
          # so the rule does not fire on prose that merely names the trigger.
          rc=0
          for f in .github/workflows/*.yml; do
            case "$(basename "$f")" in security.yml) continue ;; esac
            if sed 's/#.*//' "$f" | grep -q "pull_request_target"; then
              echo "::error file=$f::pull_request_target exposes repository secrets to fork code. Not permitted."
              rc=1
            fi
          done
          [ "$rc" -eq 0 ] && echo "ok: no pull_request_target"
          exit $rc

      - name: Require an explicit permissions block in every workflow
        run: |
          rc=0
          for f in .github/workflows/*.yml; do
            if ! grep -q "^permissions:" "$f"; then
              echo "::error file=$f::No top-level permissions block; defaults to write-all."
              rc=1
            fi
          done
          [ "$rc" -eq 0 ] && echo "ok: all workflows declare permissions"
          exit $rc

      - name: Forbid unpinned third-party actions
        run: |
          # First-party actions (actions/*, github/*) and game-ci are trusted by
          # major tag. Anything else must be pinned to a full commit SHA.
          rc=0
          while read -r line; do
            ref=$(printf '%s' "$line" | sed -n 's/.*uses:[[:space:]]*\([^[:space:]]*\).*/\1/p')
            [ -z "$ref" ] && continue
            case "$ref" in
              actions/*|github/*|game-ci/*) continue ;;
            esac
            case "$ref" in
              *@[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) continue ;;
            esac
            echo "::error::Third-party action not SHA-pinned: $ref"
            rc=1
          done < <(grep -rh "uses:" .github/workflows/ || true)
          [ "$rc" -eq 0 ] && echo "ok: no unpinned third-party actions"
          exit $rc
